name: measure

# Builds one review up while it is pending and submits it once, three ways, with the workflow's own
# token and the review job's permissions, and prints GitHub's every answer.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: measure
  cancel-in-progress: false

jobs:
  pending:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: one review, built up while pending
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 measure/measure_pending.py
