name: suppressions

on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: find the suppressions this pull request adds or changes
        run: |
          python3 tools/suppressions.py "origin/${{ github.base_ref }}" HEAD > found.json
          cat found.json

      - name: put each one to review
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys
          found = json.load(open("found.json"))
          repo, pr, sha = os.environ["GITHUB_REPOSITORY"], os.environ["PR"], os.environ["HEAD_SHA"]
          existing = subprocess.run(["gh", "api", "--paginate", f"repos/{repo}/pulls/{pr}/comments",
                                     "--jq", ".[].body"], capture_output=True, text=True, check=True).stdout
          comments = []
          for f in found:
              key = f"<!-- suppression {f['path']}:{f['comment']}|{f['covered']} -->"
              if key in existing:
                  continue
              body = (f"Suppression for review: `{f['comment']}` exempts line {f['covers']} "
                      f"(`{f['covered']}`) from CodeQL.\n\n{key}")
              comments.append({"path": f["path"], "line": f["line"], "side": "RIGHT", "body": body})
          print(len(found), "found,", len(comments), "new")
          if not comments:
              sys.exit(0)
          review = {"commit_id": sha, "event": "COMMENT", "body": "Suppressions to review.",
                    "comments": comments}
          r = subprocess.run(["gh", "api", "-X", "POST", f"repos/{repo}/pulls/{pr}/reviews",
                              "--input", "-"], input=json.dumps(review), capture_output=True, text=True)
          print(r.stdout[:2000], r.stderr[:2000])
          if r.returncode != 0:
              print("::error::the suppressions could not be put to review; they are listed above")
              sys.exit(1)
          PY
