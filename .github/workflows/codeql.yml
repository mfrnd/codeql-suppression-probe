name: codeql

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: ${{ matrix.language }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: manual
            suppression: codeql/csharp-queries:AlertSuppression.ql
          - language: python
            build-mode: none
            suppression: codeql/python-queries:AlertSuppression.ql
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality
          packs: ${{ matrix.suppression }}

      - name: build
        if: matrix.build-mode == 'manual'
        run: dotnet build src/Probe/Probe.csproj

      - id: analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
          output: sarif-results
          upload: failure-only

      - name: drop what the code suppresses, on a pull request
        if: github.event_name == 'pull_request'
        run: python3 tools/filter_sarif.py sarif-results/${{ matrix.language }}.sarif filtered/${{ matrix.language }}.sarif

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sarif-${{ matrix.language }}
          path: |
            sarif-results
            filtered

      - id: upload
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ github.event_name == 'pull_request' && 'filtered' || 'sarif-results' }}/${{ matrix.language }}.sarif
          category: /language:${{ matrix.language }}
          wait-for-processing: true

      - name: the upload landed
        env:
          GH_TOKEN: ${{ github.token }}
          SARIF_ID: ${{ steps.upload.outputs.sarif-id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/code-scanning/sarifs/$SARIF_ID"
          echo
          status=$(gh api "repos/$GITHUB_REPOSITORY/code-scanning/sarifs/$SARIF_ID" --jq .processing_status)
          [ "$status" = complete ] || { echo "::error::processing ended as $status"; exit 1; }
          for url in $(gh api "repos/$GITHUB_REPOSITORY/code-scanning/sarifs/$SARIF_ID" --jq '.analyses_url // empty'); do
            gh api "$url" --jq '.[] | "analysis \(.id): \(.results_count) results, error \"\(.error)\""'
            [ -z "$(gh api "$url" --jq '[.[] | select(.error != "")] | .[0].error // empty')" ] || { echo "::error::the analysis failed"; exit 1; }
          done

      - name: dismiss what the code suppresses, on main
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/sync_dismissals.py sarif-results/${{ matrix.language }}.sarif
          /language:${{ matrix.language }} "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_REF"
